name: Nightly arm64-v8a APK

# Builds a signed, installable FOSS release APK for arm64-v8a on every push to main.
#
# Why this exists: android-release.yml needs the original project's secrets (keystore,
# Sentry, Last.fm) and cannot run in this fork. This one needs none: the FOSS flavour
# resolves without Sentry/Last.fm, and the APK is signed with a throwaway key generated
# inside the run, so nothing secret lives in the repository.
#
# The nightly package (com.manikdev.spotify.nightly) has no F-Droid metadata, so the
# app's own unofficial-build check never gets an answer and never blocks it.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the signing key for this run
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 16)"
          echo "NIGHTLY_KEY_PASS=$PASS" >> "$GITHUB_ENV"
          keytool -genkeypair \
            -keystore spotify.jks \
            -storetype PKCS12 \
            -alias nightly \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Spotify Nightly, O=Nightly, C=IN"

      - name: Build and sign the release APK (FOSS)
        env:
          KEYSTORE_PASSWORD: ${{ env.NIGHTLY_KEY_PASS }}
          KEY_ALIAS: nightly
          KEY_PASSWORD: ${{ env.NIGHTLY_KEY_PASS }}
        run: ./build_and_sign_apk.sh --release --foss

      - name: List what was built
        run: ls -lh androidApp/build/outputs/apk/release/

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: spotify-nightly-arm64-v8a
          path: androidApp/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 30
